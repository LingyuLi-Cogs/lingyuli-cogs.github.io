<header class="site-header">
  <div class="shell header-inner">
    <a class="brand" href="{{ '/' | relative_url }}"{% if page.url == '/' %} aria-current="page"{% endif %}>
      <span class="brand-name">Homepage</span>
    </a>

    <nav class="site-nav" aria-label="Primary">
      {%- for item in site.nav %}
      <a href="{{ item.url | relative_url }}"{% if page.url contains item.url %} aria-current="page"{% endif %}>{{ item.title }}</a>
      {%- endfor %}
    </nav>

    <button class="theme-toggle" type="button" data-theme-toggle aria-label="Switch colour theme">
      {% include icon.html name="sun" class="icon-sun" %}{% include icon.html name="moon" class="icon-moon" %}
    </button>
  </div>
</header>
