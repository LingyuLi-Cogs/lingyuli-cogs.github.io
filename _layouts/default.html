<!DOCTYPE html>
<html lang="{{ page.lang | default: 'en' }}">
<head>
  {%- include head.html -%}
</head>
<body{% if page.body_class %} class="{{ page.body_class }}"{% endif %}>
  {%- include icons.html -%}

  <a class="skip-link" href="#main">Skip to content</a>

  {%- include header.html -%}

  <main id="main">
    {{ content }}
  </main>

  {%- include footer.html -%}

  <script src="{{ '/assets/js/site.js' | relative_url }}" defer></script>
</body>
</html>
